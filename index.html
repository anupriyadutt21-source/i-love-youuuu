<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday Veduuu ❤️</title>

    <link rel="stylesheet" href="Style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

</head>


<body>


    <!-- ==========================================
         HIDDEN YOUTUBE PLAYER
         ========================================== -->

    <div id="youtubePlayer"></div>


    <!-- ==========================================
         FLOATING HEARTS
         ========================================== -->

    <div class="hearts">

        <span>♡</span>
        <span>♥</span>
        <span>♡</span>
        <span>♥</span>
        <span>♡</span>
        <span>♥</span>
        <span>♡</span>
        <span>♥</span>
        <span>♡</span>
        <span>♥</span>

    </div>


    <!-- ==========================================
         HERO
         ========================================== -->

    <section class="hero">


        <div class="flower flower-left">
            🌷
        </div>


        <div class="hero-box">


            <p class="small-title">
                A little birthday surprise for
            </p>


            <h1>
                Veduuu
            </h1>


            <div class="heart-line">
                ♡ ✦ ♡
            </div>


            <p class="birthday-text">
                Happy Birthday, birthday boy 🎂
            </p>


            <button onclick="openLetter()" type="button">
                Open Your Letter 💌
            </button>


            <p class="music-note">
                🎵 Tap to open your letter and hear your birthday song
            </p>


        </div>


        <div class="flower flower-right">
            🌷
        </div>


    </section>



    <!-- ==========================================
         MEMORIES
         ========================================== -->

    <section class="memories">


        <p class="section-title">
            OUR LITTLE MEMORIES
        </p>


        <h2>
            Moments I Want To Keep 🤍
        </h2>


        <p class="memory-description">
            A few little pieces of us that I want to remember forever.
        </p>



        <div class="polaroids">


            <!-- PHOTO 1 -->

            <div class="polaroid rotate-left">

                <img
                    src="Photo1.jpg.png"
                    alt="Our memory 1"
                >

                <p>
                    One of my favourite memories ♡
                </p>

            </div>



            <!-- PHOTO 2 -->

            <div class="polaroid rotate-right">

                <img
                    src="Photo2.jpg.png"
                    alt="Our memory 2"
                >
